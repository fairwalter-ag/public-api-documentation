name: Publish

# Regenerates this repository from the live OpenAPI document once a day.
# A refused or broken specification fails the job and commits nothing.

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Fetch, validate and regenerate
        run: python3 tools/publish.py

      - name: Verify the generated output
        run: python3 -m unittest discover -s tools

      - name: Commit
        run: |
          git config user.name "fairwalter-docs"
          git config user.email "noreply@fairwalter.ch"
          git add -A
          if git diff --cached --quiet; then
            echo "Specification unchanged, nothing to commit."
            exit 0
          fi
          git commit -m "Update API documentation ($(date -u +%Y-%m-%d))"
          git push
